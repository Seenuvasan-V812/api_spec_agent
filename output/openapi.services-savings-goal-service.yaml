openapi: 3.1.0
info:
  title: Spendora Service API - savings-goal-service
  version: 1.0.0
  description: The savings-goal-service API provides comprehensive management of savings goals and their associated contributions. It supports full CRUD operations for goals, including the ability to update goal statuses. Additionally, the service includes internal endpoints for exporting user data.
  contact:
    name: API Support
    url: https://example.com/support
  license:
    name: Proprietary
servers:
- url: http://localhost:8080
paths:
  /api/v1/savings-goals:
    get:
      operationId: getSavingsGoals
      tags:
      - savingsgoal
      summary: List savings goals
      parameters:
      - name: page
        in: query
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        description: The page number to retrieve.
      - name: size
        in: query
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        description: The number of items per page.
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/GoalStatus'
        description: The status to filter by.
      responses:
        '200':
          description: Returns a list of savings goals.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_SavingsGoalResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    post:
      operationId: postSavingsGoals
      tags:
      - savingsgoal
      summary: Create a savings goal
      description: Submit a CreateSavingsGoalRequest to establish a new savings goal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSavingsGoalRequest'
        required: true
        description: Provide a CreateSavingsGoalRequest in JSON format.
      responses:
        '201':
          description: The savings goal was successfully created.
          headers:
            Location:
              schema:
                format: uri
                type: string
              required: true
        '400':
          description: The request was invalid or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/savings-goals/{id}:
    get:
      operationId: getSavingsGoalsById
      tags:
      - savingsgoal
      summary: Retrieve the details of a savings goal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the savings goal.
      responses:
        '200':
          description: The savings goal details were successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access is forbidden due to a ForbiddenOwnershipException.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    put:
      operationId: putSavingsGoalsById
      tags:
      - savingsgoal
      summary: Update a savings goal
      description: Update the details of an existing savings goal identified by the provided ID.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the savings goal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSavingsGoalRequest'
        required: true
        description: The UpdateSavingsGoalRequest containing the updated goal details.
      responses:
        '200':
          description: The savings goal was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalResponse'
        '400':
          description: The request was invalid or failed validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Access to the savings goal is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    delete:
      operationId: deleteSavingsGoalsById
      tags:
      - savingsgoal
      summary: Delete a savings goal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the savings goal.
      responses:
        '204':
          description: The savings goal was successfully deleted.
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden ownership exception occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/savings-goals/{id}/contributions:
    get:
      operationId: getSavingsGoalsByIdContributions
      tags:
      - savingsgoal
      summary: List contributions for a savings goal
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The identifier of the savings goal.
      - name: page
        in: query
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        description: The page number for pagination.
      - name: size
        in: query
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        description: The number of entries per page.
      responses:
        '200':
          description: Returns a list of contribution entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_ContributionEntryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: The request is forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    post:
      operationId: postSavingsGoalsByIdContributions
      tags:
      - savings-goals
      summary: Record a contribution to a savings goal
      description: Use this endpoint to add a contribution to the specified savings goal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the savings goal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordContributionRequest'
        required: true
        description: A RecordContributionRequest object.
      responses:
        '201':
          description: Contribution recorded successfully.
          headers:
            Location:
              schema:
                format: uri
                type: string
              required: true
        '400':
          description: Invalid argument or validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden ownership of the resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: A business conflict occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/savings-goals/{id}/status:
    patch:
      operationId: patchSavingsGoalsByIdStatus
      tags:
      - savingsgoal
      summary: Change the status of a savings goal
      description: Update the status of a specific savings goal.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The identifier of the savings goal.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGoalStatusRequest'
        required: true
        description: Provide an UpdateGoalStatusRequest in the request body.
      responses:
        '200':
          description: The savings goal status was updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavingsGoalResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ForbiddenOwnershipException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BusinessConflictException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
tags:
- name: savings-goals
- name: savingsgoal
components:
  schemas:
    ContributionEntryResponse:
      properties:
        amount:
          $ref: '#/components/schemas/MoneyDto'
        contributionEntryId:
          format: uuid
          type: string
        date:
          format: date
          type: string
        expenseId:
          format: uuid
          type: string
        source:
          $ref: '#/components/schemas/ContributionSource'
      type: object
    ContributionSource:
      enum:
      - GOAL_SCREEN
      - LINKED_EXPENSE
      type: string
    CreateSavingsGoalRequest:
      properties:
        color:
          type: string
        description:
          type: string
        icon:
          type: string
        name:
          minLength: 1
          type: string
        targetAmount:
          $ref: '#/components/schemas/MoneyDto'
        targetDate:
          format: date
          type: string
      required:
      - name
      - targetAmount
      type: object
    ErrorResponse:
      description: 'Uniform error envelope — API-3. Serializes exactly: timestamp, status, error, message, path, traceId. The {@code message} field MUST carry zero PII (CQ-13).'
      properties:
        error:
          type: string
        message:
          type: string
        path:
          type: string
        status:
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
        traceId:
          type: string
      type: object
    GoalStatus:
      enum:
      - ACTIVE
      - PAUSED
      - COMPLETED
      - ABANDONED
      type: string
    MoneyDto:
      description: Value object for monetary amounts. INR-only, scale-2, BigDecimal — never double/float (DB-5). Serializes amount as a JSON string "100.50" to avoid floating-point representation errors.
      properties:
        amount:
          type: number
        currency:
          type: string
      type: object
    PageResponse_ContributionEntryResponse:
      description: 'Uniform pagination envelope — API-2. Serializes exactly: content, page, size, totalElements, totalPages.'
      properties:
        content:
          items:
            $ref: '#/components/schemas/ContributionEntryResponse'
          type: array
        page:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int32
          type: integer
      type: object
    PageResponse_SavingsGoalResponse:
      description: 'Uniform pagination envelope — API-2. Serializes exactly: content, page, size, totalElements, totalPages.'
      properties:
        content:
          items:
            $ref: '#/components/schemas/SavingsGoalResponse'
          type: array
        page:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int32
          type: integer
      type: object
    RecordContributionRequest:
      properties:
        amount:
          $ref: '#/components/schemas/MoneyDto'
        date:
          format: date
          type: string
      required:
      - amount
      - date
      type: object
    SavingsGoalResponse:
      properties:
        color:
          type: string
        createdAt:
          format: date-time
          type: string
        description:
          type: string
        icon:
          type: string
        name:
          type: string
        percentAchieved:
          format: double
          type: number
        projectedCompletionDate:
          format: date
          type: string
        remainingAmount:
          $ref: '#/components/schemas/MoneyDto'
        savingsGoalId:
          format: uuid
          type: string
        status:
          $ref: '#/components/schemas/GoalStatus'
        targetAmount:
          $ref: '#/components/schemas/MoneyDto'
        targetDate:
          format: date
          type: string
        totalContributed:
          $ref: '#/components/schemas/MoneyDto'
      type: object
    UpdateGoalStatusRequest:
      properties:
        status:
          $ref: '#/components/schemas/GoalStatus'
      required:
      - status
      type: object
    UpdateSavingsGoalRequest:
      properties:
        color:
          type: string
        description:
          type: string
        icon:
          type: string
        name:
          type: string
        targetAmount:
          $ref: '#/components/schemas/MoneyDto'
        targetDate:
          format: date
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
