openapi: 3.1.0
info:
  title: Spendora Service API - category-service
  version: 1.0.0
  description: The category-service API provides full CRUD operations for managing categories. It includes internal endpoints to validate category visibility and transaction permissions for specific users. Additionally, the service supports exporting a user's combined set of default and custom categories.
  contact:
    name: API Support
    url: https://example.com/support
  license:
    name: Proprietary
servers:
- url: http://localhost:8080
paths:
  /api/v1/categories:
    get:
      operationId: getCategories
      tags:
      - category
      summary: List categories
      parameters:
      - name: page
        in: query
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        description: The page number to retrieve.
      - name: size
        in: query
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        description: The number of items per page.
      - name: type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/CategoryType'
        description: The type of category to filter by.
      responses:
        '200':
          description: Returns a list of CategoryResponse objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_CategoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    post:
      operationId: postCategories
      tags:
      - category
      summary: Create a new category
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
        required: true
        description: Provide a CreateCategoryRequest object.
      responses:
        '201':
          description: The category was created successfully.
          headers:
            Location:
              schema:
                format: uri
                type: string
              required: true
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BusinessConflictException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/categories/{id}:
    get:
      operationId: getCategoriesById
      tags:
      - category
      summary: Retrieve a category by its ID
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the category.
      responses:
        '200':
          description: Returns the category response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden ownership exception occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    put:
      operationId: putCategoriesById
      tags:
      - category
      summary: Update a category
      description: Update an existing category using its unique identifier.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the category.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCategoryRequest'
        required: true
        description: Provide an UpdateCategoryRequest in JSON format.
      responses:
        '200':
          description: The category was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryResponse'
        '400':
          description: Validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ForbiddenOwnershipException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BusinessConflictException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
    delete:
      operationId: deleteCategoriesById
      tags:
      - category
      summary: Delete a category
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The unique identifier of the category to delete.
      responses:
        '204':
          description: The category was successfully deleted.
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: ForbiddenOwnershipException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: BusinessConflictException occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
tags:
- name: category
components:
  schemas:
    CategoryResponse:
      properties:
        categoryId:
          format: uuid
          type: string
        color:
          type: string
        deletable:
          type: boolean
        icon:
          type: string
        name:
          type: string
        origin:
          type: string
        systemRole:
          type: string
        type:
          type: string
      type: object
    CategoryType:
      enum:
      - EXPENSE
      - INCOME
      - BOTH
      type: string
    CreateCategoryRequest:
      properties:
        color:
          maxLength: 20
          type: string
        icon:
          maxLength: 100
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
      required:
      - name
      - type
      type: object
    ErrorResponse:
      description: 'Uniform error envelope — API-3. Serializes exactly: timestamp, status, error, message, path, traceId. The {@code message} field MUST carry zero PII (CQ-13).'
      properties:
        error:
          type: string
        message:
          type: string
        path:
          type: string
        status:
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
        traceId:
          type: string
      type: object
    PageResponse_CategoryResponse:
      description: 'Uniform pagination envelope — API-2. Serializes exactly: content, page, size, totalElements, totalPages.'
      properties:
        content:
          items:
            $ref: '#/components/schemas/CategoryResponse'
          type: array
        page:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int32
          type: integer
      type: object
    UpdateCategoryRequest:
      properties:
        color:
          maxLength: 20
          type: string
        icon:
          maxLength: 100
          type: string
        name:
          maxLength: 100
          minLength: 1
          type: string
        type:
          $ref: '#/components/schemas/CategoryType'
      required:
      - name
      - type
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
