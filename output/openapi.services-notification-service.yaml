openapi: 3.1.0
info:
  title: Spendora Service API - notification-service
  version: 1.0.0
  description: The notification-service API provides endpoints for managing and retrieving user notifications. It allows clients to fetch a list of notifications and check the current unread count. Additionally, it supports marking individual notifications or all notifications as read.
  contact:
    name: API Support
    url: https://example.com/support
  license:
    name: Proprietary
servers:
- url: http://localhost:8080
paths:
  /api/v1/notifications:
    get:
      operationId: getNotifications
      tags:
      - notification
      summary: List notifications
      parameters:
      - name: page
        in: query
        required: false
        schema:
          default: 0
          format: int32
          type: integer
        description: The page number to retrieve.
      - name: size
        in: query
        required: false
        schema:
          default: 20
          format: int32
          type: integer
        description: The number of items per page.
      - name: status
        in: query
        required: false
        schema:
          default: unread
          type: string
        description: Filter notifications by status.
      responses:
        '200':
          description: Returns a list of NotificationResponse objects.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageResponse_NotificationResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/notifications/mark-all-read:
    post:
      operationId: postNotificationsMarkAllRead
      tags:
      - notification
      summary: Mark all notifications as read
      responses:
        '200':
          description: The notifications have been marked as read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkAllReadResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/notifications/unread-count:
    get:
      operationId: getNotificationsUnreadCount
      tags:
      - notification
      summary: Get the unread notification count
      responses:
        '200':
          description: Returns the unread count response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnreadCountResponse'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /api/v1/notifications/{id}/read:
    patch:
      operationId: patchNotificationsByIdRead
      tags:
      - notification
      summary: Mark a notification as read
      parameters:
      - name: id
        in: path
        required: true
        schema:
          format: uuid
          type: string
        description: The identifier of the notification.
      responses:
        '204':
          description: The notification was successfully marked as read.
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden ownership exception occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
tags:
- name: notification
components:
  schemas:
    ErrorResponse:
      description: 'Uniform error envelope — API-3. Serializes exactly: timestamp, status, error, message, path, traceId. The {@code message} field MUST carry zero PII (CQ-13).'
      properties:
        error:
          type: string
        message:
          type: string
        path:
          type: string
        status:
          format: int32
          type: integer
        timestamp:
          format: date-time
          type: string
        traceId:
          type: string
      type: object
    MarkAllReadResponse:
      description: Count of Notifications transitioned unread → read (contract §DTOs).
      properties:
        updated:
          format: int32
          type: integer
      type: object
    NotificationResponse:
      description: 'Notification Center read-model DTO (contract §DTOs). AL-4: entities never serialized. {@code body} carries no PII/amounts (CQ-13); {@code readAt} is null until marked read.'
      properties:
        body:
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          format: uuid
          type: string
        read:
          type: boolean
        readAt:
          format: date-time
          type: string
        title:
          type: string
        type:
          $ref: '#/components/schemas/NotificationType'
      type: object
    NotificationType:
      description: Client-facing Notification type enum (Doc 09 §9.1). The four canonical types surfaced in the Notification Center. Transactional emails (verify/reset) do NOT create a Notification row.
      enum:
      - BUDGET_ALERT
      - GOAL_COMPLETED
      - WEEKLY_DIGEST
      - RECURRING_GENERATION_FAILURE
      type: string
    PageResponse_NotificationResponse:
      description: 'Uniform pagination envelope — API-2. Serializes exactly: content, page, size, totalElements, totalPages.'
      properties:
        content:
          items:
            $ref: '#/components/schemas/NotificationResponse'
          type: array
        page:
          format: int32
          type: integer
        size:
          format: int32
          type: integer
        totalElements:
          format: int64
          type: integer
        totalPages:
          format: int32
          type: integer
      type: object
    UnreadCountResponse:
      description: Current unread count for the Notification Center badge (contract §DTOs).
      properties:
        unread:
          format: int64
          type: integer
      type: object
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
